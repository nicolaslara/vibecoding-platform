repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff checks
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff formatting
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
